<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#15202b;--muted:#5b6b7a;--line:#dde3e9;--accent:#0f7b6c;--accent-soft:#d8efe9;--chunk:#e8f0fb;--chunk-ink:#1d4f91;--warn:#b4541a;--warn-soft:#fbe9dc;
--f-d:"Outfit","IBM Plex Sans KR",system-ui,sans-serif;--f-b:"IBM Plex Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--surface:#18212a;--ink:#e6edf3;--muted:#93a4b4;--line:#2a3743;--accent:#46c2ad;--accent-soft:#163a35;--chunk:#1b2b40;--chunk-ink:#9cc3ff;--warn:#f0a06a;--warn-soft:#3a2516;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 60px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;gap:6px;overflow-x:auto}nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
nav a.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
h1{font-family:var(--f-d);font-size:22px;margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.stat b{font-size:17px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.word{font-family:var(--f-d);font-size:34px;font-weight:700;line-height:1.2}
.pos{font-size:14px;color:var(--muted);margin-left:6px;font-weight:500}
.ko{font-size:20px;font-weight:700}
.grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}.grid dt{color:var(--muted)}.grid dd{margin:0}
.ex{background:var(--chunk);color:var(--chunk-ink);border-radius:10px;padding:10px 14px}
.ex small{display:block;color:var(--muted)}
.q{font-size:19px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-size:17px;text-align:left;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt.right{background:var(--accent-soft);border-color:var(--accent)}.opt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.bad{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.msg{font-weight:600;min-height:1.4em}.msg.ok{color:var(--accent)}.msg.bad{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:6px;font-size:15px}.list div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

const INT=[0,1,3,7,14,30]; // 상자별 다음 복습까지 일수
const DAYMS=86400000, NEW_PER=10;
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let st={}; try{st=JSON.parse(localStorage.getItem('voc1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('voc1',JSON.stringify(st))}catch(e){}};
let queue=[], cur=null, nNew=0, nDue=0;
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function build(extraNew){
  const now=Date.now();
  const due=W.filter(x=>st[x.w]&&st[x.w].due<=now);
  const fresh=W.filter(x=>!st[x.w]).slice(0,extraNew);if(typeof dayLabel==='function')dayLabel();
  nNew=fresh.length; nDue=due.length;
  queue=[...shuffle(due).map(x=>({x,learn:false})), ...fresh.map(x=>({x,learn:true}))];
  next();
}
function stats(){
  $('sNew').textContent=nNew;$('sDue').textContent=nDue;$('sLeft').textContent=queue.length+(cur?1:0);
  $('sSeen').textContent=W.filter(x=>st[x.w]).length;
  $('sDone').textContent=W.filter(x=>st[x.w]&&st[x.w].box>=3).length;$('sAll').textContent=W.length;
}
function show(id){['learn','quiz','end'].forEach(k=>$(k).hidden=k!==id)}
function next(){
  cur=queue.shift()||null; stats();
  if(!cur){show('end');return}
  if(cur.learn){learn(cur.x)} else quiz(cur.x);
}
function learn(x){
  show('learn');
  $('lw').textContent=x.w;$('lp').textContent=x.pos;$('lk').textContent=x.ko;
  $('lc').textContent=x.col.replace(/[{}]/g,'');$('lf').textContent=x.fam;$('ls').textContent=x.syn;
  $('le').textContent=x.ex;$('lek').textContent=x.exko;
  $('lspeak').onclick=()=>speak(x.w+'. '+x.ex);
  $('lgo').onclick=()=>{cur.learn=false;quiz(x)};
  speak(x.w);
}
function others(x){return W.filter(y=>y!==x)}
function quiz(x){
  show('quiz');
  const types=['recall','cloze','col','syn'];
  const t=types[Math.floor(Math.random()*types.length)];
  $('qmsg').textContent='';$('qex').hidden=true;$('nextRow').hidden=true;$('recallBtns').hidden=true;$('gradeBtns').hidden=true;$('qopts').innerHTML='';$('qhint').textContent='';
  const ex=`${x.ex}<small>${x.exko}</small>`;
  if(t==='recall'){
    $('qtype').textContent='뜻 → 단어 떠올리기';
    $('qq').textContent=x.ko+' ('+x.pos+')';
    $('qhint').textContent='영어 단어를 먼저 소리 내서 떠올려 보세요. 첫 글자: '+x.w[0];
    $('recallBtns').hidden=false;
    $('reveal').onclick=()=>{$('recallBtns').hidden=true;$('qq').innerHTML=`${x.ko} → <b>${x.w}</b>`;$('qex').innerHTML=ex;$('qex').hidden=false;$('gradeBtns').hidden=false;speak(x.w)};
    $('gOk').onclick=()=>grade(x,true,true);$('gBad').onclick=()=>grade(x,false,true);
    return;
  }
  let q,ans,choices;
  if(t==='cloze'){$('qtype').textContent='토익 Part 5 · 빈칸에 알맞은 형태';
    q=x.ex.replace(x.form,'______');ans=x.form;choices=[x.form,...x.formAlt];
    $('qhint').textContent=x.exko;}
  else if(t==='col'){$('qtype').textContent='짝 표현 완성';
    ans=x.col.match(/\{(.+?)\}/)[1];q=x.col.replace(/\{.+?\}/,'______');choices=[ans,...x.colAlt];
    $('qhint').textContent='뜻: '+x.ko+' ('+x.w+')';}
  else {$('qtype').textContent='비슷한 말 고르기 (Part 7 바꿔 말하기)';
    ans=x.syn.split(',')[0].trim();q=`${x.w} ≈ ?`;
    choices=[ans,...shuffle(others(x).map(y=>y.syn.split(',')[0].trim()).filter(s=>s!==ans)).slice(0,3)];}
  $('qq').textContent=q;
  shuffle(choices).forEach(c=>{const b=document.createElement('button');b.className='opt';b.textContent=c;
    b.onclick=()=>{if(!$('nextRow').hidden)return;const ok=c===ans;b.classList.add(ok?'right':'wrong');
      if(!ok)[...$('qopts').children].find(e=>e.textContent===ans).classList.add('right');
      $('qmsg').className='msg '+(ok?'ok':'bad');$('qmsg').textContent=ok?'정답!':'정답은 '+ans;
      $('qex').innerHTML=`<b>${x.w}</b> ${x.ko}<br>`+ex;$('qex').hidden=false;grade(x,ok,false)};
    $('qopts').append(b)});
}
function grade(x,ok,advance){
  const s=st[x.w]||{box:0,due:0};
  if(ok){s.box=Math.min(s.box+1,INT.length-1);s.due=Date.now()+INT[s.box]*DAYMS-3600000}
  else{s.box=1;s.due=Date.now()+DAYMS-3600000;queue.splice(Math.min(3,queue.length),0,{x,learn:false})}
  st[x.w]=s;save();stats();
  $('gradeBtns').hidden=true;$('nextRow').hidden=false;
  $('qspeak').onclick=()=>speak(x.ex);$('qnext').onclick=next;
}
$('more').onclick=()=>build(NEW_PER);

function dayLabel(){const f=W.find(x=>!st[x.w]);$('day').textContent=f?f.day:'전체 복습'}
dayLabel();
build(NEW_PER);
