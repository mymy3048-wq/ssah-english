<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">

<title>쌓는 영어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Outfit:wght@500;700&display=swap">
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#15202b;--muted:#5b6b7a;--line:#dde3e9;--accent:#0f7b6c;--accent-soft:#d8efe9;--chunk:#e8f0fb;--chunk-ink:#1d4f91;--warn:#b4541a;--warn-soft:#fbe9dc;
--f-d:"Outfit","IBM Plex Sans KR",system-ui,sans-serif;--f-b:"IBM Plex Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--surface:#18212a;--ink:#e6edf3;--muted:#93a4b4;--line:#2a3743;--accent:#46c2ad;--accent-soft:#163a35;--chunk:#1b2b40;--chunk-ink:#9cc3ff;--warn:#f0a06a;--warn-soft:#3a2516;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px 120px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;gap:6px}nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
nav a.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:9px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:4px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--muted);font-size:14px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.head{display:flex;justify-content:space-between;align-items:baseline}
.ko{font-size:21px;font-weight:700;line-height:1.45}
.big{font-size:25px}
/* 생각 타이머 */
.think{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.ring{--p:0;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring b{width:62px;height:62px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-d);font-size:26px}
/* 단계 사다리 */
.ladder{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--line);padding-left:12px}
.rung{font-size:15px}.rung .k{color:var(--muted);font-size:13px;display:block}
.rung.now{font-weight:700;font-size:17px}.rung.now .k{color:var(--chunk-ink);font-size:15px}
.rung.todo{opacity:.35}
.built{min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:19px}
.built .fixed{color:var(--accent);font-weight:600}
.tiles{display:flex;flex-wrap:wrap;gap:8px;transition:filter .3s}
.tiles.blur{filter:blur(7px);pointer-events:none;user-select:none}
.tile{font:inherit;font-size:18px;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer}
.tile.used{visibility:hidden}.tile.chunk{background:var(--chunk);color:var(--chunk-ink);border-color:transparent}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:12px;padding:11px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.msg{font-weight:600;min-height:1.5em}.msg.ok{color:var(--accent)}.msg.bad{color:var(--warn)}
.point{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:15px}
.reveal{background:var(--chunk);color:var(--chunk-ink);border-radius:12px;padding:10px 14px;font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 2fr;gap:8px}
.dock .btn{padding:12px 4px}
/* 정리 */
.pat{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.pat summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pat summary::-webkit-details-marker{display:none}
.pat .en{font-family:var(--f-d);font-weight:700;font-size:18px;color:var(--chunk-ink)}
.pat .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.pat .body{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px}
.sent{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.blk{display:grid;grid-template-columns:1fr 1.2fr;gap:8px;font-size:15px;align-items:start}
.blk .e{font-weight:600;cursor:pointer}
.hideEn .blk .e{color:transparent;background:var(--line);border-radius:6px}
.hideEn .blk .e.show{color:inherit;background:none}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.today{gap:10px;padding:14px 16px}
.tst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tst div{background:var(--bg);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column}
.tst b{font-family:var(--f-d);font-size:24px;line-height:1.2;color:var(--accent)}.tst span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--warn-soft);color:var(--warn);margin-left:6px}
.tag{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;padding:0 7px;margin-right:6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}.tag.done{background:var(--chunk);color:var(--chunk-ink)}
</style>
<div class="wrap">
  <nav><a href="./" class="on">회화</a><a href="vocab">어휘</a><a href="listening">리스닝</a><a href="reading">리딩</a></nav>
  <div class="seg"><button id="tabP" class="on">연습</button><button id="tabR">정리 · 복습</button></div>

  <!-- 연습 -->
  <section id="practice" style="display:flex;flex-direction:column;gap:14px">
    <div class="card today">
      <div class="head"><span class="label">오늘의 학습</span><span class="muted" id="tDate"></span></div>
      <div class="tst"><div><b id="tN">0</b><span>오늘 완성한 문장</span></div><div><b id="tMiss">0</b><span>다시 볼 문장</span></div><div><b id="tVoc">0</b><span>어휘 복습 대기</span></div></div>
      <div class="opts2"><button class="btn" id="goMiss">🔁 틀린 문장 복습</button><a class="btn" href="vocab" style="text-align:center;text-decoration:none">📚 어휘 복습</a></div>
    </div>
    <div class="field"><span class="label">에피소드</span><select id="ep"></select></div>
    <div class="opts2">
      <button class="btn" id="shuf">순서 섞기: 끔</button>
      <select id="tsec" aria-label="고민 시간"><option value="0">고민 시간 없음</option><option value="3">고민 3초</option><option value="5" selected>고민 5초</option><option value="8">고민 8초</option></select>
    </div>
    <div>
      <div class="head"><span class="label" id="eplabel"></span><span class="muted" id="count"></span></div>
      <div class="progress"><i id="prog"></i></div>
    </div>

    <div class="card" id="introbox">
      <div class="label">먼저 생각해 보기</div>
      <div class="muted" id="introq" hidden></div>
      <div class="ko big" id="introko"></div>
      <div class="think" id="think1"><div class="ring" id="ring1"><b id="sec1"></b></div><div class="muted">소리 내서 영어로 말해 보세요</div></div>
      <div class="reveal" id="introen" hidden></div>
      <div class="opts2" id="introBtns"><button class="btn" id="peek">정답 보기</button><button class="btn pri" id="start">블록 만들기 ▶</button></div>
    </div>

    <div class="card" id="work" hidden>
      <div class="label" id="steplabel"></div>
      <div class="ladder" id="ladder"></div>
      <div class="built" id="built"></div>
      <div class="think" id="think2" hidden><div class="ring" id="ring2"><b id="sec2"></b></div><div class="muted">블록 없이 먼저 떠올려 보세요 · <button class="btn sm" id="skipT">바로 보기</button></div></div>
      <div class="tiles" id="tiles"></div>
      <div class="msg" id="msg"></div>
      <div class="point" id="point" hidden></div>
    </div>
  </section>

  <!-- 정리 -->
  <section id="review" hidden style="flex-direction:column;gap:12px">
    <div class="opts2">
      <select id="rmode"><option value="pat">패턴별 모아보기</option><option value="ep">에피소드별 문장 블록</option><option value="pt">문법 포인트 모음</option></select>
      <button class="btn" id="hideEn">영어 가리기: 끔</button>
    </div>
    <div class="muted" id="rhelp"></div>
    <div id="rlist" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>
</div>
<div class="dock" id="dock"><div class="in">
  <button class="btn" id="prev">◀</button><button class="btn" id="undo">지우기</button><button class="btn" id="hint">힌트</button><button class="btn pri" id="check">확인</button>
</div></div>
<script>
const ALL={"episodes": [{"label": "01편", "title": "회사 생활", "id": "", "sentences": [{"no": 1, "ko": "회의가 생각보다 길어져서 점심을 못 먹었어요.", "en": "I couldn't have lunch because the meeting ran longer than I expected.", "steps": [{"ko": "점심을 못 먹었어요.", "en": "I couldn't have lunch."}, {"ko": "+ 회의가 길어져서", "en": "I couldn't have lunch because the meeting ran long."}, {"ko": "+ 생각보다 길어져서", "en": "I couldn't have lunch because the meeting ran longer than I expected."}], "point": "이유는 뒤에 because + 문장. 길어지다 = run long, 생각보다 = than I expected"}, {"no": 2, "ko": "이 일을 끝내는 데 이틀이 걸렸어요.", "en": "It took me two days to finish this work.", "steps": [{"ko": "이틀이 걸렸어요.", "en": "It took two days."}, {"ko": "+ 나한테", "en": "It took me two days."}, {"ko": "+ 이 일을 끝내는 데", "en": "It took me two days to finish this work."}], "point": "~하는 데 시간이 걸리다 = It takes (사람) 시간 to 동사. 주어는 It"}, {"no": 3, "ko": "다음 주까지 보고서를 보내 주시면 검토해 볼게요.", "en": "I'll take a look if you send me the report by next week.", "steps": [{"ko": "검토해 볼게요.", "en": "I'll take a look."}, {"ko": "+ 보고서를 보내 주시면", "en": "I'll take a look if you send me the report."}, {"ko": "+ 다음 주까지", "en": "I'll take a look if you send me the report by next week."}], "point": "마감은 by, 계속은 until. if 뒤엔 미래라도 현재형"}, {"no": 4, "ko": "제가 처음 일했던 회사는 지하철역 바로 옆, 강남에 있었어요.", "en": "The first company I worked for was in Gangnam, right next to the subway station.", "steps": [{"ko": "첫 회사는 강남에 있었어요.", "en": "The first company was in Gangnam."}, {"ko": "+ 제가 일했던 첫 회사는", "en": "The first company I worked for was in Gangnam."}, {"ko": "+ 지하철역 바로 옆", "en": "The first company I worked for was in Gangnam, right next to the subway station."}], "point": "명사 뒤에 문장을 붙여 꾸며요(관계절). 회사에서 일하다 = work for"}, {"no": 5, "ko": "입사한 지 벌써 3년이 됐어요.", "en": "It's already been three years since I joined the company.", "steps": [{"ko": "3년이 됐어요.", "en": "It's been three years."}, {"ko": "+ 벌써 3년이 됐어요", "en": "It's already been three years."}, {"ko": "+ 입사한 지", "en": "It's already been three years since I joined the company."}], "point": "~한 지 (기간)이 됐다 = It's been 기간 since 과거문장"}, {"no": 6, "ko": "요즘 야근을 너무 많이 해서 피곤해요.", "en": "I'm tired because I've been working late too often these days.", "steps": [{"ko": "피곤해요.", "en": "I'm tired."}, {"ko": "+ 야근을 해서", "en": "I'm tired because I've been working late."}, {"ko": "+ 요즘 너무 자주", "en": "I'm tired because I've been working late too often these days."}], "point": "요즘 계속 ~해 왔다 = have been -ing. 야근하다 = work late"}, {"no": 7, "ko": "지난주에 팀장님이 저한테 그 프로젝트를 맡기셨어요.", "en": "My manager put me in charge of the project last week.", "steps": [{"ko": "팀장님이 저한테 맡기셨어요.", "en": "My manager put me in charge."}, {"ko": "+ 그 프로젝트를", "en": "My manager put me in charge of the project."}, {"ko": "+ 지난주에", "en": "My manager put me in charge of the project last week."}], "point": "맡기다 = put 사람 in charge of. 책임자 = in charge"}, {"no": 8, "ko": "출근하자마자 메일부터 확인해요.", "en": "I check my email first as soon as I get to work.", "steps": [{"ko": "메일을 확인해요.", "en": "I check my email."}, {"ko": "+ 먼저", "en": "I check my email first."}, {"ko": "+ 출근하자마자", "en": "I check my email first as soon as I get to work."}], "point": "~하자마자 = as soon as. 출근하다 = get to work (go to work는 '출근길에 나서다')"}, {"no": 9, "ko": "월요일까지 끝내야 해서 주말에도 일해야 해요.", "en": "I have to work this weekend because it has to be done by Monday.", "steps": [{"ko": "주말에 일해야 해요.", "en": "I have to work this weekend."}, {"ko": "+ 끝내야 해서", "en": "I have to work this weekend because it has to be done."}, {"ko": "+ 월요일까지", "en": "I have to work this weekend because it has to be done by Monday."}], "point": "끝내져야 한다 = has to be done (수동). 이번 주말 = this weekend (on 없음)"}, {"no": 10, "ko": "다음 주에 휴가 가기 전에 인수인계를 해야 해요.", "en": "I need to hand over my work before I go on vacation next week.", "steps": [{"ko": "인수인계를 해야 해요.", "en": "I need to hand over my work."}, {"ko": "+ 휴가 가기 전에", "en": "I need to hand over my work before I go on vacation."}, {"ko": "+ 다음 주에", "en": "I need to hand over my work before I go on vacation next week."}], "point": "인수인계하다 = hand over. 휴가 가다 = go on vacation (on!)"}, {"no": 11, "ko": "회사가 집에서 멀어서 매일 한 시간씩 걸려요.", "en": "My office is far from my home, so it takes an hour every day.", "steps": [{"ko": "회사가 멀어요.", "en": "My office is far."}, {"ko": "+ 집에서", "en": "My office is far from my home."}, {"ko": "+ 그래서 매일 한 시간 걸려요", "en": "My office is far from my home, so it takes an hour every day."}], "point": "A에서 멀다 = far from A. 결과는 so로 이어요"}, {"no": 12, "ko": "이번 분기 목표를 겨우 달성했어요.", "en": "We barely hit our target for this quarter.", "steps": [{"ko": "목표를 달성했어요.", "en": "We hit our target."}, {"ko": "+ 겨우 달성했어요", "en": "We barely hit our target."}, {"ko": "+ 이번 분기", "en": "We barely hit our target for this quarter."}], "point": "겨우 = barely (부정 느낌 '아슬아슬'). 목표 달성 = hit/meet a target"}, {"no": 13, "ko": "제 업무는 주로 고객 문의에 답하는 거예요.", "en": "My job is mainly to respond to customer inquiries.", "steps": [{"ko": "제 업무는 답하는 거예요.", "en": "My job is to respond."}, {"ko": "+ 주로 답하는 거예요", "en": "My job is mainly to respond."}, {"ko": "+ 고객 문의에", "en": "My job is mainly to respond to customer inquiries."}], "point": "~하는 것이다 = is to 동사. 답하다 = respond to (to 빠뜨리기 쉬움)"}, {"no": 14, "ko": "신입이라 아직 모르는 게 많아요.", "en": "I'm still new here, so there's a lot I don't know yet.", "steps": [{"ko": "저는 아직 신입이에요.", "en": "I'm still new here."}, {"ko": "+ 그래서 모르는 게 많아요", "en": "I'm still new here, so there's a lot I don't know."}, {"ko": "+ 아직", "en": "I'm still new here, so there's a lot I don't know yet."}], "point": "모르는 게 많다 = there's a lot I don't know. 신입 = new here"}, {"no": 15, "ko": "그 회의는 안 가도 된다고 들었어요.", "en": "I heard that I don't have to attend the meeting.", "steps": [{"ko": "들었어요.", "en": "I heard."}, {"ko": "+ 안 가도 된다고", "en": "I heard that I don't have to attend."}, {"ko": "+ 그 회의는", "en": "I heard that I don't have to attend the meeting."}], "point": "안 해도 된다 = don't have to (금지 must not 과 다름). attend 뒤엔 전치사 없음"}]}, {"label": "02편", "title": " function makeOrder(){order=DATA.sentences.map((_,i)=>i);if(shuf)order=shuffle(order);oi=0;si=order[0]}
let rec={},today={d:'',n:0},slip=false,reviewing=false;
try{rec=JSON.parse(localStorage.getItem('build-rec')||'{}');today=JSON.parse(localStorage.getItem('build-day')||'{}')}catch(e){}
const dstr=()=>new Date().toLocaleDateString('ko-KR');if(today.d!==dstr())today={d:dstr(),n:0};
function saveRec(){try{localStorage.setItem('build-rec',JSON.stringify(rec));localStorage.setItem('build-day',JSON.stringify(today))}catch(e){}}
const keyOf=s=>(s._ep||DATA.label)+'#'+s.no;
let si=0, step=0, picked=[], pool=[], prefix=[], target=[], mode='word', done=false, intro=true, timer=null, thinking=false;
const CONF={on:['in','at','for'],in:['on','at','to'],at:['in','on','to'],for:['to','during','since'],to:['for','at','into'],
 with:['to','for','by'],during:['for','while'],while:['during','when'],by:['until','with'],until:['by','to'],
 every:['each','all'],a:['the','an'],the:['a'],my:['me','mine'],his:['him','he'],her:['she','hers'],me:['my','I'],
 is:['are','was'],are:['is','were'],was:['were','is'],will:['would','am'],if:['when','whether'],whether:['if'],
 about:['of','for'],of:['about','for'],from:['to','of'],into:['to','in'],some:['any'],what:['that','which'],
 last:['next','this'],this:['last','next'],tonight:['today','night'],morning:['mornings','day'],times:['time'],
 home:['house'],get:['take','go'],take:['get','have'],go:['come','went'],have:['has','had'],
 can:['could','will'],could:['can','would'],would:['will','could'],do:['does','did'],need:['want','needs'],want:['wanna','need'],
 like:['love','want'],"i'm":["i","i'll"],"i'll":["i'm","i'd"],"i'd":["i'll","i'm"],you:['your','yours'],your:['you','yours'],it:['that','its'],that:['it','this']};
// 단계가 늘어날수록 함정도 늘림 → 난이도 상승
function distractors(rest,n){const out=[];const low=rest.map(w=>w.toLowerCase());
  shuffle(low).forEach(w=>(CONF[w]||[]).forEach(c=>{if(!low.includes(c)&&!out.includes(c))out.push(c)}));
  let picks=shuffle(out).slice(0,n);
  if(picks.length<n)picks=picks.concat(shuffle(otherWords().filter(w=>!low.includes(w.toLowerCase())&&!picks.includes(w))).slice(0,n-picks.length));
  return picks}
const S=()=>DATA.sentences[si];
function diff(k){const cur=words(S().steps[k].en);if(k===0)return{pre:[],rest:cur};
  const prev=words(S().steps[k-1].en);let i=0;while(i<prev.length&&i<cur.length&&eq(prev[i],cur[i]))i++;
  return{pre:cur.slice(0,i),rest:cur.slice(i)}}
function otherWords(){const set=new Set();DATA.sentences.forEach((s,i)=>{if(i!==si)words(s.steps[0].en).forEach(w=>set.add(w))});return[...set]}
function countdown(ring,sec,onEnd){clearInterval(timer);thinking=true;let t=tsec*10;const tot=t;
  const tick=()=>{$(sec).textContent=Math.ceil(t/10);$(ring).style.setProperty('--p',(1-t/tot)*100);if(t--<=0){clearInterval(timer);thinking=false;onEnd()}};tick();timer=setInterval(tick,100)}
function setup(){
  if(intro&&step===0)slip=false;
  const{pre,rest}=diff(step);prefix=pre;picked=[];done=false;
  mode=step===0?'word':'chunk';target=rest;
  const extra=distractors(rest,step===0?3:4);
  pool=shuffle([...rest,...extra]).map((t,i)=>({t,i,used:false}));
  render();
  if(intro)startIntro();else startStep();
}
function startIntro(){
  $('introBtns').hidden=tsec>0;$('think1').hidden=!tsec;
  if(tsec)countdown('ring1','sec1',()=>{$('think1').hidden=true;$('introBtns').hidden=false});
}
function startStep(){
  if(!tsec){$('think2').hidden=true;$('tiles').classList.remove('blur');return}
  $('think2').hidden=false;$('tiles').classList.add('blur');
  countdown('ring2','sec2',endStepThink);
}
function endStepThink(){clearInterval(timer);thinking=false;$('think2').hidden=true;$('tiles').classList.remove('blur')}
$('skipT').onclick=endStepThink;
function render(){
  const s=S(),st=s.steps[step];
  $('introbox').hidden=!intro;$('work').hidden=intro;$('dock').hidden=intro;
  $('eplabel').textContent=DATA.label+' · '+DATA.title;$('count').textContent=`${oi+1} / ${order.length}`;
  $('prog').style.width=((oi+(intro?0:(step+(done?1:0))/s.steps.length))/order.length*100)+'%';
  if(intro){$('introq').hidden=!s.q;$('introq').textContent='질문: '+(s.q||'');$('introko').textContent=s.ko;$('introen').hidden=true;$('introen').textContent=s.en;return}
  $('steplabel').textContent=step===0?`1 / ${s.steps.length} · 뼈대 문장`:`${step+1} / ${s.steps.length} · 덩어리 붙이기`;
  $('ladder').innerHTML=`<div class="rung"><span class="k">완성 문장</span>${esc(s.ko)}</div>`+s.steps.map((x,k)=>
    `<div class="rung ${k<step?'':k===step?'now':'todo'}"><span class="k">${esc(x.ko)}</span>${k<step||(k===step&&done)?esc(x.en):k===step?'?':''}</div>`).join('');
  const b=$('built');b.innerHTML='';
  prefix.forEach(w=>{const e=document.createElement('span');e.className='fixed';e.textContent=w;b.append(e)});
  picked.forEach((p,n)=>{const e=document.createElement('button');e.className='tile'+(mode==='chunk'?' chunk':'');e.textContent=p.t;
    e.onclick=()=>{if(done)return;pool[p.i].used=false;picked.splice(n,1);render()};b.append(e)});
  const t=$('tiles');t.innerHTML='';
  pool.forEach(p=>{const e=document.createElement('button');e.className='tile'+(mode==='chunk'?' chunk':'')+(p.used?' used':'');e.textContent=p.t;
    e.onclick=()=>{if(done||p.used||thinking)return;p.used=true;picked.push(p);$('msg').textContent='';render()};t.append(e)});
  $('point').hidden=!(done&&step===s.steps.length-1&&s.point);$('point').textContent='포인트: '+(s.point||'');
  $('check').textContent=done?(step<s.steps.length-1?'다음 단계 ▶':'다음 문장 ▶'):'확인';
}
$('check').onclick=()=>{
  const s=S();
  if(done){if(step<s.steps.length-1){step++;setup()}else go(1);$('msg').textContent='';return}
  if(thinking){endStepThink();return}
  const got=picked.map(p=>p.t).join(' '),want=target.join(' ');
  if(eq(got,want)){done=true;if(step===s.steps.length-1)record(s);$('msg').className='msg ok';$('msg').textContent='맞아요! '+s.steps[step].en;speak(s.steps[step].en);render()}
  else{if(picked.length)slip=true;$('msg').className='msg bad';$('msg').textContent=picked.length?'다시 해볼까요? 순서나 블록을 확인하세요.':'블록을 먼저 골라주세요.'}
};
$('undo').onclick=()=>{if(done||!picked.length)return;const p=picked.pop();pool[p.i].used=false;render()};
$('hint').onclick=()=>{if(done)return;endStepThink();slip=true;
  let n=0;while(n<picked.length&&eq(picked[n].t,target[n]))n++;
  while(picked.length>n){const p=picked.pop();pool[p.i].used=false}
  const p=pool.find(x=>!x.used&&eq(x.t,target[n]));if(p){p.used=true;picked.push(p)}$('msg').className='msg';$('msg').textContent='다음 단어를 하나 채웠어요.';render()};
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function go(d){clearInterval(timer);oi=(oi+d+order.length)%order.length;si=order[oi];step=0;intro=true;$('msg').textContent='';setup();scrollTo(0,0)}
$('prev').onclick=()=>{if(!intro&&step>0){step--;setup()}else go(-1)};
function pickEp(i){ei=i;DATA=ALL.episodes[ei];save();makeOrder();step=0;intro=true;setup()}
$('ep').innerHTML=ALL.episodes.map((e,i)=>`<option value="${i}">${esc(e.label)} · ${esc(e.title)} (${e.sentences.length})</option>`).join('');
$('ep').value=ei;$('ep').onchange=()=>{const v=+$('ep').value;if(v<0)return $('goMiss').onclick();reviewing=false;const o=[...$('ep').options].find(o=>o.value==='-1');if(o)o.remove();pickEp(v)};
function drawShuf(){$('shuf').textContent='순서 섞기: '+(shuf?'켬':'끔');$('shuf').classList.toggle('on',shuf)}
$('shuf').onclick=()=>{shuf=!shuf;save();drawShuf();makeOrder();step=0;intro=true;setup()};
$('tsec').value=tsec;$('tsec').onchange=()=>{tsec=+$('tsec').value;save();setup()};
$('start').onclick=()=>{intro=false;render();startStep()};
$('peek').onclick=()=>{$('introen').hidden=false;speak(S().en)};

function record(s){const k=keyOf(s),r=rec[k]||{ok:0,miss:0};if(slip){r.miss++;r.need=true}else{r.ok++;r.need=false}r.t=Date.now();rec[k]=r;today.n++;saveRec();drawToday()}
function missList(){return ALL.episodes.flatMap(e=>e.sentences.filter(s=>(rec[e.label+'#'+s.no]||{}).need).map(s=>({...s,_ep:e.label})))}
function drawToday(){$('tDate').textContent=today.d;$('tN').textContent=today.n;const m=missList().length;$('tMiss').textContent=m;
  let v=0;try{const st=JSON.parse(localStorage.getItem('voc1')||'{}'),now=Date.now();v=Object.values(st).filter(x=>x.due<=now).length}catch(e){}$('tVoc').textContent=v;
  $('goMiss').disabled=!m;$('goMiss').style.opacity=m?1:.5;
  [...$('ep').options].forEach(o=>{const e=ALL.episodes[+o.value];if(!e)return;const d=e.sentences.filter(s=>rec[e.label+'#'+s.no]).length;o.textContent=`${e.label} · ${e.title.replace(/ \| .*/,'')} (${d}/${e.sentences.length})`})}
$('goMiss').onclick=()=>{const L=missList();if(!L.length)return;reviewing=true;DATA={label:'🔁 복습',title:'틀린 문장 '+L.length+'개',sentences:L};
  if(![...$('ep').options].some(o=>o.value==='-1')){const o=document.createElement('option');o.value='-1';$('ep').prepend(o)}$('ep').options[0].textContent='🔁 틀린 문장 복습';$('ep').value='-1';makeOrder();step=0;intro=true;setup()};
/* ---------- 정리 · 복습 ---------- */
const PATS=[
["I want (to) / I wanna","~를 원해요 · ~하고 싶어요",/\b(wants?|wanna)\b/i],
["I'd like to / I'd like","~하고 싶어요 · ~주세요 (공손)",/\bi'd like\b/i],
["I need to","~해야 해요",/\bi need to\b/i],
["I need","~이 필요해요",/\bi need (?!to)/i],
["I have to","~해야 해요 (의무)",/\bi have to\b/i],
["Can I get / Could I get","~주시겠어요? (주문·요청)",/\b(can|could) (i|we) get\b/i],
["Can I ~?","~해도 돼요? / ~할 수 있어요?",/^can i (?!get)/i],
["Could you ~?","~해 주실래요?",/\b(could|can) you\b/i],
["Is it okay / possible","~해도 될까요? / ~가능할까요?",/\bis it (okay|ok|possible)\b/i],
["Do you have","~있나요?",/\bdo you have\b/i],
["Is there","~있나요? (장소에)",/\bis there\b/i],
["I'm looking for","~를 찾고 있어요",/\bi'm looking for\b/i],
["I'm looking forward to","~가 기대돼요",/\blooking forward to\b/i],
["I'm thinking about","~할까 생각 중이에요",/\bthinking about\b/i],
["I'm not sure","~인지 잘 모르겠어요",/\bi'm not sure\b/i],
["I don't think","~아닌 것 같아요",/\bi don't think\b/i],
["I'll have / I'll take","~로 할게요 (주문·결정)",/\bi'll (have|take)\b/i],
["I'll ~","~할게요 (지금 정한 것)",/\bi'll (?!have|take)/i],
["Let me","제가 ~할게요",/\blet me\b/i],
["I forgot to","~하는 걸 깜빡했어요",/\bforgot to\b/i],
["I try (not) to","~하려고 (안 하려고) 해요",/\btry (not )?to\b/i],
["I hope","~하면 좋겠어요",/\bi hope\b/i],
["How long / How much / What time","얼마나 / 얼마 / 몇 시",/^(how long|how much|what time)\b/i],
["Where is / How do I","어디 / 어떻게",/^(where is|how do i)\b/i],
["to + 동사","~하려고 (목적)",/\bto (?!the|a|my|your|me|you|him|her|work|school|bed)\w+/i],
["because / so","~때문에 / 그래서",/\b(because|so that|so i)\b/i],
["when / if","~할 때 / ~하면",/\b(when|if) (i|you|it|we)\b/i]];
let hideEn=false;
const allSent=()=>ALL.episodes.flatMap(e=>e.sentences.map(s=>({...s,ep:e.label})));
function sentHTML(s){const r=rec[s.ep+'#'+s.no];return `<div class="sent"><div class="muted">${esc(s.ep)} · ${esc(s.ko)}${r?(r.need?'<span class="badge">다시 보기</span>':' ✓'):''}</div>`+
  s.steps.map((x,k)=>`<div class="blk"><span>${k?'':'<span class="tag">뼈대</span>'}${esc(x.ko)}</span><span class="e" data-say="${esc(x.en)}">${esc(k?'… '+chunkOf(s,k):x.en)}</span></div>`).join('')+
  `<div class="blk"><span><span class="tag done">완성</span></span><span class="e" data-say="${esc(s.en)}">${esc(s.en)}</span></div></div>`}
function chunkOf(s,k){const c=words(s.steps[k].en),p=words(s.steps[k-1].en);let i=0;while(i<p.length&&eq(p[i],c[i]))i++;return c.slice(i).join(' ')}
function drawReview(){
  const m=$('rmode').value,L=$('rlist');L.innerHTML='';L.classList.toggle('hideEn',hideEn);
  const S=allSent();
  if(m==='pat'){
    $('rhelp').textContent='자주 쓰는 문장 뼈대별로 모았어요. 눌러서 펼치고, 영어를 눌러서 들어 보세요. "영어 가리기"를 켜면 한국어만 보고 떠올리는 복습이 돼요.';
    PATS.forEach(([en,ko,re])=>{const hit=S.filter(s=>re.test(s.en));if(!hit.length)return;
      const d=document.createElement('details');d.className='pat';
      d.innerHTML=`<summary><span><span class="en">${esc(en)}</span><br><span class="muted">${esc(ko)}</span></span><span class="cnt">${hit.length}문장 ▾</span></summary><div class="body">${hit.map(sentHTML).join('')}</div>`;L.append(d)});
  }else if(m==='ep'){
    $('rhelp').textContent='에피소드별로 문장을 뼈대 → 덩어리 블록으로 나눠 보여줘요.';
    ALL.episodes.forEach(e=>{const d=document.createElement('details');d.className='pat';
      d.innerHTML=`<summary><span><span class="en">${esc(e.label)}</span><br><span class="muted">${esc(e.title)}</span></span><span class="cnt">${e.sentences.length}문장 ▾</span></summary><div class="body">${e.sentences.map(s=>sentHTML({...s,ep:e.label})).join('')}</div>`;L.append(d)});
  }else{
    $('rhelp').textContent='문장마다 붙어 있던 문법·표현 포인트를 모았어요.';
    const d=document.createElement('div');d.className='card';
    d.innerHTML=S.filter(s=>s.point).map(s=>`<div class="sent"><b>${esc(s.point)}</b><div class="blk"><span class="muted">${esc(s.ko)}</span><span class="e" data-say="${esc(s.en)}">${esc(s.en)}</span></div></div>`).join('');L.append(d);
  }
}
$('rlist').onclick=e=>{const t=e.target.closest('.e');if(!t)return;if(hideEn&&!t.classList.contains('show')){t.classList.add('show');return}speak(t.dataset.say)};
$('rmode').onchange=drawReview;
$('hideEn').onclick=()=>{hideEn=!hideEn;$('hideEn').textContent='영어 가리기: '+(hideEn?'켬':'끔');$('hideEn').classList.toggle('on',hideEn);drawReview()};
function tab(r){$('tabP').classList.toggle('on',!r);$('tabR').classList.toggle('on',r);$('practice').style.display=r?'none':'flex';$('review').hidden=!r;$('review').style.display=r?'flex':'none';
  $('dock').style.display=r?'none':'';if(r)drawReview();else render();clearInterval(timer);if(!r)setup()}
$('tabP').onclick=()=>tab(false);$('tabR').onclick=()=>tab(true);

drawShuf();makeOrder();setup();drawToday();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
