<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7b6c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="voice.js"></script>
<script src="common.js"></script>
<title>회화 리스닝</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Outfit:wght@500;700&display=swap">
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#15202b;--muted:#5b6b7a;--line:#dde3e9;--accent:#0f7b6c;--accent-soft:#d8efe9;--chunk:#e8f0fb;--chunk-ink:#1d4f91;--warn:#b4541a;--warn-soft:#fbe9dc;
--f-d:"Outfit","IBM Plex Sans KR",system-ui,sans-serif;--f-b:"IBM Plex Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--surface:#18212a;--ink:#e6edf3;--muted:#93a4b4;--line:#2a3743;--accent:#46c2ad;--accent-soft:#163a35;--chunk:#1b2b40;--chunk-ink:#9cc3ff;--warn:#f0a06a;--warn-soft:#3a2516;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 60px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;gap:6px;overflow-x:auto}nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
nav a.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
h1{font-family:var(--f-d);font-size:22px;margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.stat b{font-size:17px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.word{font-family:var(--f-d);font-size:34px;font-weight:700;line-height:1.2}
.pos{font-size:14px;color:var(--muted);margin-left:6px;font-weight:500}
.ko{font-size:20px;font-weight:700}
.grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}.grid dt{color:var(--muted)}.grid dd{margin:0}
.ex{background:var(--chunk);color:var(--chunk-ink);border-radius:10px;padding:10px 14px}
.ex small{display:block;color:var(--muted)}
.q{font-size:19px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-size:17px;text-align:left;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt.right{background:var(--accent-soft);border-color:var(--accent)}.opt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.bad{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.msg{font-weight:600;min-height:1.4em}.msg.ok{color:var(--accent)}.msg.bad{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:6px;font-size:15px}.list div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
select{width:auto;padding:2px 6px;font-size:14px}
mark{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.en{font-size:18px;font-weight:600}.tip{font-size:15px;color:var(--chunk-ink)}
.doc{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;line-height:1.65}
.qbox{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chip{font:inherit;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
</style>
<div class="wrap">
  <nav><a href="./">회화</a><a href="vocab">어휘</a><a href="listening" class="on">리스닝</a><a href="reading">리딩</a></nav>
  <h1>회화 리스닝</h1>
  <div class="muted">💬 대화 듣기: 여러 턴 대화를 끝까지 듣고 이해하기 · 문장 세트: 한 문장씩 정확히 듣고 따라 말하기</div>
  <div class="chips" id="sets"></div>
  <div class="stats"><span class="stat">진행 <b id="sPos">0</b> / <span id="sTot"></span></span><span class="stat">한 번에 알아들음 <b id="sOk">0</b></span>
    <span class="stat">속도 <select id="rate"><option value="0.75">느리게</option><option value="0.95" selected>보통</option><option value="1.15">빠르게</option></select></span>
    <span class="stat">목소리 <select id="vsel"><option value="">미국 남자(자동)</option></select></span></div>

  <div class="card" id="card">
    <div class="label" id="step"></div>
    <div class="row"><button class="btn pri" id="play">🔊 듣기</button><button class="btn" id="slow">🐢 천천히</button></div>
    <div id="s1">
      <div class="q">무슨 뜻일까요? (글자 없이 듣기만)</div>
      <div class="opts" id="opts"></div>
    </div>
    <div id="s2" hidden>
      <div class="q">들은 대로 적어 보세요</div>
      <textarea id="typed" rows="2" placeholder="영어로 입력 (철자 틀려도 괜찮아요)" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      <div class="row"><button class="btn" id="skip">건너뛰기</button><button class="btn pri" id="check">채점</button></div>
    </div>
    <div id="s3" hidden>
      <div class="ex"><div id="diff" class="en"></div><small id="ko"></small></div>
      <div class="tip" id="tip"></div>
      <div class="q">따라 말하기: 듣고 바로 소리 내서 3번</div>
      <div class="row"><button class="btn" id="mic">🎤 말해서 확인</button><span class="muted" id="heard"></span></div>
      <div class="row"><button class="btn pri" id="next">다음 ▶</button></div>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card" id="dcard" hidden>
    <div class="label" id="dkind"></div>
    <div class="q" id="dtitle"></div>
    <div class="muted" id="dsit"></div>
    <div class="row"><button class="btn pri" id="dplay">▶ 대화 전체 듣기</button><button class="btn" id="dstop">■ 멈춤</button></div>
    <div id="dqs"></div>
    <div id="dafter" hidden>
      <div class="label">대본 (줄을 누르면 그 줄만 들려요 · 듣고 따라 말하기)</div>
      <div class="list" id="dlines"></div>
      <div class="row"><button class="btn pri" id="dnext">다음 대화 ▶</button></div>
    </div>
  </div>
  <div class="muted" id="howto">순서: ① 글자 없이 듣고 뜻 고르기 → ② 받아쓰기 → ③ 문장 확인 + 따라 말하기. 원어민이 실제로 줄여 말하는 소리(연음)를 표시해 줘요.</div>
</div>
<script>
// en 문장, ko 뜻, tip 실제 들리는 소리
const SETS={
"일상 대화":[
["What have you been up to?","요즘 뭐 하고 지냈어?","What've you been → 왓츄빈 / 왓브빈. have가 거의 안 들려요."],
["I'm gonna grab a coffee. Want one?","커피 사러 갈 건데, 너도 마실래?","going to → gonna, Want one → 원원"],
["Did you get a chance to look at it?","그거 한번 볼 시간 있었어?","Did you → 디쥬, get a → 게러"],
["It's not a big deal.","별일 아니야.","not a → 나러, big deal 붙여서"],
["I'll let you know.","알려줄게.","let you → 레츄"],
["Sorry, I didn't catch that.","미안, 잘 못 들었어.","didn't catch that → 디든캐치댓, t가 거의 안 들려요"],
["Could you say that again?","다시 한번 말해 줄래?","Could you → 쿠쥬"],
["That makes sense.","그거 말 되네 / 이해돼.","makes sense → 메익쎈스"],
["I was about to call you.","막 너한테 전화하려던 참이었어.","was about to → 워저바우루, t가 r처럼 굴러요"],
["Let's figure it out.","같이 해결해 보자.","figure it out → 피겨리라웃"],
["What do you mean by that?","그게 무슨 뜻이야?","What do you → 와루유 / 와댜"],
["I'm on my way.","가는 중이야.","on my → 언마이"],
["It slipped my mind.","깜빡했어.","slipped my → 슬립마이, ed가 약해요"],
["No worries, take your time.","걱정 마, 천천히 해.","take your → 테이큐어"],
["Hang on a second.","잠깐만.","Hang on a → 행어너"]],
"업무 대화":[
["Can we push the meeting to Thursday?","회의를 목요일로 미룰 수 있을까요?","push the → 푸시더, 미루다 = push"],
["Let me get back to you on that.","그건 확인하고 다시 알려드릴게요.","get back to you → 겟백투유 / 겟배커유"],
["I'll loop you in.","당신도 (메일/논의에) 넣어 둘게요.","loop in = 논의에 포함시키다"],
["Are we on the same page?","우리 같은 생각인 거죠?","on the same page = 이해가 일치하다"],
["Can you walk me through it?","단계별로 설명해 주실래요?","walk me through it → 웍미뜨루잇"],
["It's still up in the air.","아직 정해지지 않았어요.","up in the air → 업피니디에어"],
["Let's touch base next week.","다음 주에 다시 얘기해요.","touch base = 잠깐 연락/점검하다"],
["We're running a bit behind.","일정이 조금 늦어지고 있어요.","running a bit → 러닝어빗"],
["Could you send me the latest version?","최신 버전 보내 주시겠어요?","Could you send me → 쿠쥬센미"],
["I'm swamped right now.","지금 일이 너무 많아요.","swamped = 일에 파묻힌"],
["Let's take this offline.","이건 따로 얘기해요.","회의 중 '나중에 따로' 의 뜻"],
["What's the timeline on this?","이건 일정이 어떻게 돼요?","What's the → 왓츠더"],
["I'll keep you posted.","진행 상황 계속 알려드릴게요.","keep you posted → 키퓨포스티드"],
["That works for me.","저는 그거 괜찮아요.","works for me → 웍스퍼미"],
["Can I jump in here?","제가 잠깐 끼어들어도 될까요?","jump in = 대화에 끼어들다"]],
"전화·온라인 회의":[
["Can you hear me okay?","제 말 잘 들리세요?","hear me → 히어미"],
["You're on mute.","음소거 되어 있어요.","on mute → 언뮤트"],
["You're breaking up a little.","소리가 조금 끊겨요.","breaking up = 소리가 끊기다"],
["Let me share my screen.","제 화면 공유할게요.","share my → 셰어마이"],
["Sorry, go ahead.","죄송해요, 먼저 말씀하세요.","go ahead → 고어헤드 (동시에 말했을 때)"],
["I think we lost him.","그분 연결이 끊긴 것 같아요.","lost him → 로스팀, h가 사라져요"],
["Can everyone see my screen?","다들 제 화면 보이세요?","see my → 씨마이"],
["I'll drop the link in the chat.","채팅창에 링크 올릴게요.","drop = 올리다/남기다"],
["Let's wrap up here.","여기서 마무리하죠.","wrap up → 랩업 (붙여서)"],
["Thanks for your time, everyone.","다들 시간 내 주셔서 감사합니다.","Thanks for your → 땡스퍼유어"]]
};
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let set=Object.keys(SETS)[0],list=[],pos=0,ok=0,firstTry=true;
try{const r=localStorage.getItem('lis2-rate');if(r)$('rate').value=r}catch(e){}
$('rate').onchange=()=>{try{localStorage.setItem('lis2-rate',$('rate').value)}catch(e){}};
function speak(t,r){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||+$('rate').value;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let dmode=true;
function mode(dm){dmode=dm;$('dcard').hidden=!dm;$('card').hidden=dm;$('howto').hidden=dm;speechSynthesis.cancel();dplaying=false}
function chips(){const el=$('sets');el.innerHTML='';{const b=document.createElement('button');b.className='chip'+(dmode?' on':'');b.textContent='💬 대화 듣기 ('+DLG.length+')';b.onclick=()=>{mode(true);chips();openDlg(di)};el.append(b)}Object.keys(SETS).forEach(k=>{const b=document.createElement('button');b.className='chip'+(!dmode&&k===set?' on':'');b.textContent=k+' ('+SETS[k].length+')';b.onclick=()=>{set=k;mode(false);chips();start()};el.append(b)})}
function start(){list=shuffle(SETS[set]);pos=0;ok=0;$('sTot').textContent=list.length;show()}
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean)}
function show(){
  $('sPos').textContent=Math.min(pos+1,list.length);$('sOk').textContent=ok;$('msg').textContent='';
  if(pos>=list.length){$('step').textContent='끝!';['s1','s2','s3'].forEach(k=>$(k).hidden=true);$('msg').className='msg ok';$('msg').textContent=`${list.length}문장 중 ${ok}개를 한 번에 알아들었어요. 위에서 다른 세트를 고르거나 다시 시작하세요.`;$('play').onclick=start;$('play').textContent='↻ 다시';return}
  $('play').textContent='🔊 듣기';
  const [en,ko]=list[pos];firstTry=true;
  $('step').textContent='① 듣고 뜻 고르기';$('s1').hidden=false;$('s2').hidden=true;$('s3').hidden=true;
  $('play').onclick=()=>speak(en);$('slow').onclick=()=>speak(en,.65);
  const wrong=shuffle(Object.values(SETS).flat().filter(x=>x[0]!==en)).slice(0,2).map(x=>x[1]);
  $('opts').innerHTML='';
  shuffle([ko,...wrong]).forEach(c=>{const b=document.createElement('button');b.className='opt';b.textContent=c;
    b.onclick=()=>{if(c===ko){b.classList.add('right');if(firstTry)ok++;$('sOk').textContent=ok;setTimeout(()=>dict(),500)}
      else{b.classList.add('wrong');firstTry=false;$('msg').className='msg bad';$('msg').textContent='다시 들어 보세요';speak(en)}};
    $('opts').append(b)});
  setTimeout(()=>speak(en),300);
}
function dict(){$('msg').textContent='';$('step').textContent='② 받아쓰기';$('s1').hidden=true;$('s2').hidden=false;$('typed').value='';$('check').onclick=()=>reveal(true);$('skip').onclick=()=>reveal(false)}
function reveal(typed){
  const [en,ko,tip]=list[pos];
  $('step').textContent='③ 확인 + 따라 말하기';$('s2').hidden=true;$('s3').hidden=false;
  const got=new Set(norm($('typed').value));
  $('diff').innerHTML=en.split(' ').map(w=>{const n=norm(w)[0];return typed&&n&&!got.has(n)?`<mark>${w}</mark>`:w}).join(' ');
  $('ko').textContent=ko;$('tip').innerHTML='🎧 들리는 소리: '+tip;
  if(typed){const miss=$('diff').querySelectorAll('mark').length;$('msg').className='msg '+(miss?'bad':'ok');$('msg').textContent=miss?`놓친 단어 ${miss}개 (주황색)`:'완벽해요!'}
  $('heard').textContent='';$('next').onclick=()=>{pos++;show()};
  speak(en);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$('mic').hidden=true;
$('mic').onclick=()=>{const r=new SR();r.lang='en-US';r.maxAlternatives=1;$('heard').textContent='듣는 중…';
  r.onresult=e=>{const said=e.results[0][0].transcript,target=norm(list[pos][0]),s=new Set(norm(said));const hit=target.filter(w=>s.has(w)).length;
    $('heard').textContent=`"${said}" — ${Math.round(hit/target.length*100)}% 일치`};
  r.onerror=()=>{$('heard').textContent='인식 실패. 다시 눌러 보세요'};r.start()};
// 대화: t 제목, s 상황, l [화자, 영어, 한국어], q [[질문, 보기들, 정답번호]]
const DLG=[
{t:"커피 주문",s:"카페에서 주문하는 상황",l:[
["A","Hi, what can I get for you?","안녕하세요, 뭘 드릴까요?"],["B","Can I get a large iced latte, please?","아이스 라테 큰 걸로 주시겠어요?"],
["A","Sure. Would you like oat milk or regular?","네. 귀리 우유로 드릴까요, 일반 우유로 드릴까요?"],["B","Regular is fine. Oh, and can I get an extra shot?","일반으로 주세요. 아, 샷 추가해 주실 수 있나요?"],
["A","No problem. Is that for here or to go?","그럼요. 드시고 가세요, 가져가세요?"],["B","To go, please. Can I pay by card?","가져갈게요. 카드로 계산돼요?"],["A","Of course. Just tap it here.","물론이죠. 여기 대 주세요."]],
q:[["B가 주문한 것은?",["아이스 라테 + 샷 추가","핫 라테 + 귀리 우유","아메리카노 두 잔"],0],["B는 어디서 마시나?",["가져간다","매장에서","아직 안 정함"],0]]},
{t:"오랜만에 만난 동료",s:"복도에서 우연히 마주침",l:[
["A","Hey, long time no see! How have you been?","어, 오랜만이야! 어떻게 지냈어?"],["B","Pretty good, just super busy. We've got a big launch next month.","잘 지냈어, 그냥 엄청 바빠. 다음 달에 큰 출시가 있거든."],
["A","Oh, the new app? I heard about that.","아, 새 앱? 얘기 들었어."],["B","Yeah. It's been crazy, but it's coming together.","응. 정신없었는데 그래도 점점 잡혀 가."],
["A","We should grab lunch sometime.","언제 점심 한번 먹자."],["B","Definitely. How about Thursday?","좋지. 목요일 어때?"],["A","Thursday works. I'll send you a message.","목요일 좋아. 메시지 보낼게."]],

let di=0,dplaying=false;
let VO=[];function loadV(){VO=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang))}
try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function sayLine(who,t,cb){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=+$('rate').value;
  const n={A:0,B:1,C:2}[who]||0;const M=window.MALE_VOICES||[];let pref='';try{pref=localStorage.getItem('voice')||''}catch(e){}
  if(M.length>1&&!pref){u.voice=M[n%M.length];u.pitch=1}else{const v=pickVoice(0);if(v)u.voice=v;u.pitch=M.length||pref?[1,0.88,1.1][n]:[0.7,0.82,0.62][n]}
  u.onend=()=>cb&&cb();speechSynthesis.speak(u)}catch(e){cb&&cb()}}
function playAll(){speechSynthesis.cancel();dplaying=true;const L=DLG[di].l;let k=0;
  const nxt=()=>{if(!dplaying||k>=L.length){dplaying=false;return}const [w,e]=L[k++];sayLine(w,e,()=>setTimeout(nxt,350))};nxt()}
function openDlg(k){di=k;const d=DLG[di];$('dkind').textContent=`대화 ${di+1} / ${DLG.length} · ${d.l.length}턴`;$('dtitle').textContent=d.t;$('dsit').textContent='상황: '+d.s+' — 글자 없이 끝까지 듣고 질문에 답하세요.';
  $('dafter').hidden=true;$('dqs').innerHTML='';let done=0;
  d.q.forEach(([q,o,a])=>{const box=document.createElement('div');box.className='qbox';box.innerHTML=`<div class="q">${q}</div>`;const op=document.createElement('div');op.className='opts';
    const ord=o.map((_,n)=>n).sort(()=>Math.random()-.5);
    ord.forEach(n=>{const b=document.createElement('button');b.className='opt';b.textContent=o[n];b.onclick=()=>{if(op.dataset.d)return;op.dataset.d=1;b.classList.add(n===a?'right':'wrong');if(n!==a)op.children[ord.indexOf(a)].classList.add('right');if(++done===d.q.length)script()};op.append(b)});
    box.append(op);$('dqs').append(box)});
  $('dplay').onclick=playAll;$('dstop').onclick=()=>{dplaying=false;speechSynthesis.cancel()};$('dnext').onclick=()=>openDlg((di+1)%DLG.length)}
function script(){$('dafter').hidden=false;$('dlines').innerHTML='';DLG[di].l.forEach(([w,e,k])=>{const r=document.createElement('div');r.style.cursor='pointer';r.style.flexDirection='column';r.style.alignItems='flex-start';
  r.innerHTML=`<span><b>${w}:</b> ${e}</span><span class="muted">${k}</span>`;r.onclick=()=>{dplaying=false;speechSynthesis.cancel();sayLine(w,e)};$('dlines').append(r)})}

function fillV(){const sel=$('vsel');const cur=(()=>{try{return localStorage.getItem('voice')||''}catch(e){return ''}})();
  sel.innerHTML='<option value="">미국 남자(자동)</option>'+(window.US_VOICES||[]).map(v=>`<option${v.name===cur?' selected':''}>${v.name}</option>`).join('')}
fillV();try{speechSynthesis.addEventListener('voiceschanged',()=>setTimeout(fillV,50))}catch(e){}
$('vsel').onchange=()=>{try{localStorage.setItem('voice',$('vsel').value)}catch(e){};speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("Hi, this is my voice.");u.lang='en-US';speechSynthesis.speak(u)};
chips();start();mode(true);openDlg(0);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
