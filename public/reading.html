<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7b6c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="voice.js"></script>
<script src="common.js"></script>
<title>업무 리딩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Outfit:wght@500;700&display=swap">
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#15202b;--muted:#5b6b7a;--line:#dde3e9;--accent:#0f7b6c;--accent-soft:#d8efe9;--chunk:#e8f0fb;--chunk-ink:#1d4f91;--warn:#b4541a;--warn-soft:#fbe9dc;
--f-d:"Outfit","IBM Plex Sans KR",system-ui,sans-serif;--f-b:"IBM Plex Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--surface:#18212a;--ink:#e6edf3;--muted:#93a4b4;--line:#2a3743;--accent:#46c2ad;--accent-soft:#163a35;--chunk:#1b2b40;--chunk-ink:#9cc3ff;--warn:#f0a06a;--warn-soft:#3a2516;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:17px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 60px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;gap:6px;overflow-x:auto}nav a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
nav a.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
h1{font-family:var(--f-d);font-size:22px;margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.stat b{font-size:17px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.word{font-family:var(--f-d);font-size:34px;font-weight:700;line-height:1.2}
.pos{font-size:14px;color:var(--muted);margin-left:6px;font-weight:500}
.ko{font-size:20px;font-weight:700}
.grid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}.grid dt{color:var(--muted)}.grid dd{margin:0}
.ex{background:var(--chunk);color:var(--chunk-ink);border-radius:10px;padding:10px 14px}
.ex small{display:block;color:var(--muted)}
.q{font-size:19px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-size:17px;text-align:left;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
.opt.right{background:var(--accent-soft);border-color:var(--accent)}.opt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.bad{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.msg{font-weight:600;min-height:1.4em}.msg.ok{color:var(--accent)}.msg.bad{color:var(--warn)}
.list{display:flex;flex-direction:column;gap:6px;font-size:15px}.list div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
select{width:auto;padding:2px 6px;font-size:14px}
mark{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.en{font-size:18px;font-weight:600}.tip{font-size:15px;color:var(--chunk-ink)}
.doc{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;line-height:1.65}
.qbox{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chip{font:inherit;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
</style>
<div class="wrap">
  <nav><a href="./">회화</a><a href="vocab">어휘</a><a href="listening">리스닝</a><a href="reading" class="on">리딩</a></nav>
  <h1>업무 리딩</h1>
  <div class="chips" id="list"></div>
  <div class="card" id="card">
    <div class="label" id="kind"></div>
    <div class="q" id="title"></div>
    <div class="muted" id="timer"></div>
    <div class="doc" id="body"></div>
    <div class="row"><button class="btn" id="speakDoc">🔊 읽어 주기</button><button class="btn" id="koBtn">한국어 보기</button></div>
    <div class="ex" id="koBox" hidden></div>
    <div id="qs"></div>
    <div id="after" hidden>
      <div class="label">꼭 챙길 업무 표현 (눌러서 듣기)</div>
      <div class="list" id="phr"></div>
      <div class="row"><button class="btn pri" id="nextDoc">다음 글 ▶</button></div>
    </div>
  </div>
  <div class="muted">빨리 훑어 읽고(시간 표시) → 핵심 질문에 답하고 → 표현을 챙겨요. 실무에서는 '누가, 무엇을, 언제까지' 를 빨리 잡는 게 핵심이에요.</div>
</div>
<script>
const DOCS=[
{kind:"이메일",title:"Re: Q3 report draft",
body:`Hi Minjun,

Thanks for sending the draft over. Overall it looks good, but a few things need to be fixed before we share it with the client:

1. The sales figures on page 4 don't match the dashboard. Could you double-check them?
2. Please move the summary to the first page.

Could you send me the revised version by end of day Thursday? Let me know if you have any questions.

Best,
Sarah`,
ko:"초안 고마워요. 전체적으로 좋지만 고객과 공유하기 전에 몇 가지 고쳐야 해요. 1) 4페이지 매출 수치가 대시보드와 안 맞아요. 다시 확인해 줄래요? 2) 요약을 첫 페이지로 옮겨 주세요. 수정본을 목요일 업무 종료 전까지 보내 줄래요?",
qs:[["Sarah가 요청한 것은?",["수정본을 목요일까지 보내기","고객에게 직접 보고서 보내기","대시보드 새로 만들기"],0],
["문제가 된 부분은?",["4페이지 매출 수치","표지 디자인","고객 이름"],0]],
phr:[["send it over","(자료를) 보내 주다"],["double-check","다시 확인하다"],["by end of day (EOD)","오늘/그날 업무 종료 전까지"],["Let me know if you have any questions.","궁금한 거 있으면 알려 주세요."]]},
{kind:"슬랙 메시지",title:"#project-alpha",
body:`Kevin: Heads up — the client moved the demo up to Monday.
Kevin: Can someone take a look at the login bug before then? It's blocking the demo.
Yuna: I can take it. Do we have a ticket for it?
Kevin: Not yet, I'll create one and assign it to you. Thanks!`,
ko:"케빈: 미리 알려요 — 고객이 데모를 월요일로 앞당겼어요. 그 전에 누가 로그인 버그 좀 봐 줄 수 있나요? 데모를 막고 있어요. 유나: 제가 맡을게요. 티켓 있나요? 케빈: 아직이요, 만들어서 유나에게 배정할게요.",
qs:[["무엇이 바뀌었나?",["데모가 월요일로 앞당겨졌다","데모가 취소됐다","고객이 바뀌었다"],0],
["로그인 버그는 누가 고치나?",["Yuna","Kevin","고객"],0]],
phr:[["Heads up","미리 알려 드려요 (주의)"],["move up","(일정을) 앞당기다"],["It's blocking ~","~를 진행 못 하게 막고 있다"],["I can take it.","제가 맡을게요."],["assign it to you","당신에게 배정하다"]]},
{kind:"회의록",title:"Weekly sync — action items",
body:`Attendees: Lisa, Tom, Jin

Decisions
- The launch date stays at May 20.
- We will not add the export feature in this release.

Action items
- Tom: finalize the pricing page (due May 10)
- Jin: run the load test and share results (due May 13)
- Lisa: confirm the press release with marketing

Next meeting: Wednesday 10 a.m.`,
ko:"결정: 출시일은 5월 20일 유지. 이번 릴리스에 내보내기 기능은 추가하지 않음. 할 일: 톰-가격 페이지 확정(5/10), 진-부하 테스트 후 결과 공유(5/13), 리사-마케팅과 보도자료 확인. 다음 회의 수요일 10시.",
qs:[["결정된 사항은?",["출시일 유지, 내보내기 기능 제외","출시일 연기","내보내기 기능 추가"],0],
["Jin이 할 일은?",["부하 테스트 후 결과 공유","가격 페이지 확정","보도자료 확인"],0]],
phr:[["action items","해야 할 일 (담당자 지정)"],["finalize","최종 확정하다"],["due May 10","5월 10일 마감"],["share results","결과를 공유하다"]]},
{kind:"공지 이메일",title:"Office closure on Friday",
body:`Dear all,

Please note that the office will be closed this Friday for building maintenance. Employees are expected to work from home that day.

If you need equipment from the office, please pick it up by Thursday 6 p.m. The IT help desk will be available online as usual.

Thank you for your understanding.
Facilities Team`,
ko:"건물 유지보수로 이번 금요일 사무실이 닫습니다. 그날은 재택근무해 주세요. 사무실 장비가 필요하면 목요일 6시까지 가져가세요. IT 헬프데스크는 평소처럼 온라인으로 운영됩니다.",
qs:[["금요일에 직원은?",["재택근무한다","출근한다","휴가다"],0],
["장비가 필요하면?",["목요일 6시까지 가져간다","금요일에 IT에 요청한다","월요일에 받는다"],0]],
phr:[["Please note that ~","~를 참고해 주세요"],["be expected to","~해야 한다 (공손한 지시)"],["pick it up","가져가다/찾아가다"],["Thank you for your understanding.","양해해 주셔서 감사합니다."]]},
{kind:"고객 이메일",title:"Delay in shipment",
body:`Dear Mr. Park,

We regret to inform you that your order #4821 will be delayed by about one week due to a parts shortage. We now expect to ship it on June 12.

We apologize for the inconvenience. If this delay causes a problem, please let us know and we will do our best to find a solution, such as a partial shipment.

Kind regards,
Emma Clarke
Customer Service`,
ko:"부품 부족으로 주문 #4821이 약 1주일 지연될 예정입니다. 6월 12일 발송 예정입니다. 불편을 드려 죄송합니다. 지연이 문제가 되면 알려 주세요. 부분 발송 같은 해결책을 찾아보겠습니다.",
qs:[["지연 이유는?",["부품 부족","날씨","주소 오류"],0],
["제안한 해결책은?",["부분 발송","전액 환불","주문 취소"],0]],
phr:[["We regret to inform you that ~","~를 알려 드리게 되어 유감입니다"],["due to","~때문에"],["We apologize for the inconvenience.","불편을 드려 죄송합니다."],["do our best to","최선을 다해 ~하다"]]},
{kind:"요청 이메일",title:"Quick favor",
body:`Hi Daniel,

Hope you're doing well. I'm putting together the budget for next year and was wondering if you could share last year's vendor costs for your team.

No rush — sometime next week is fine. A rough number is okay if you don't have the exact figures.

Thanks a lot,
Mia`,
ko:"잘 지내시죠? 내년 예산을 정리하고 있는데, 팀의 작년 업체 비용을 공유해 주실 수 있을까요? 급하지 않아요, 다음 주 중이면 돼요. 정확한 수치가 없으면 대략적인 숫자도 괜찮아요.",
qs:[["Mia가 원하는 것은?",["작년 업체 비용","내년 예산 승인","새 업체 추천"],0],
["얼마나 급한가?",["급하지 않음, 다음 주 중","오늘 안","내일 아침"],0]],
phr:[["put together","(자료를) 정리하다, 만들다"],["I was wondering if you could ~","~해 주실 수 있을까요? (공손)"],["No rush","급하지 않아요"],["a rough number","대략적인 수치"]]},
{kind:"기술 문서",title:"Release notes v2.3",
body:`What's new
- You can now export reports as PDF.
- Search results load up to 40% faster.

Bug fixes
- Fixed an issue where some users could not reset their password.

Known issues
- Dark mode is not yet supported on the settings page. A fix is planned for v2.4.`,
ko:"새 기능: 보고서를 PDF로 내보내기 가능. 검색 결과 최대 40% 빠르게 로딩. 버그 수정: 일부 사용자가 비밀번호를 재설정하지 못하던 문제 수정. 알려진 문제: 설정 페이지 다크 모드 아직 미지원, v2.4에서 수정 예정.",
qs:[["아직 해결 안 된 것은?",["설정 페이지 다크 모드","비밀번호 재설정","PDF 내보내기"],0],
["검색은 얼마나 빨라졌나?",["최대 40%","정확히 4배","변화 없음"],0]],
phr:[["What's new","새로운 기능"],["Fixed an issue where ~","~하던 문제 수정"],["Known issues","알려진 문제"],["is planned for","~에 예정되어 있다"]]},
{kind:"이메일",title:"Following up",
body:`Hi Jason,

I just wanted to follow up on my email from last Tuesday about the contract renewal. Have you had a chance to review the updated terms?

We'd like to finalize everything by the end of the month, so please let me know if you need any changes.

Best regards,
Hana`,
ko:"지난 화요일 계약 갱신 관련 메일에 대해 다시 연락드려요. 수정된 조건을 검토해 보셨나요? 이달 말까지 모두 확정하고 싶으니 변경이 필요하면 알려 주세요.",
qs:[["이 메일의 목적은?",["이전 메일에 대한 재확인 요청","계약 해지 통보","회의 일정 잡기"],0],
["언제까지 확정하고 싶은가?",["이달 말","다음 주 화요일","내년"],0]],
phr:[["follow up on","~에 대해 다시 확인/연락하다"],["Have you had a chance to ~?","~해 보셨나요? (재촉을 부드럽게)"],["contract renewal","계약 갱신"],["updated terms","수정된 조건"]]}
];
const $=id=>document.getElementById(id);
let st={};try{st=JSON.parse(localStorage.getItem('read2')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('read2',JSON.stringify(st))}catch(e){}};
let i=0,t0=0;
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function chips(){$('list').innerHTML='';DOCS.forEach((d,k)=>{const b=document.createElement('button');b.className='chip'+(k===i?' on':'');b.textContent=(st[k]?'✓ ':'')+(k+1)+'. '+d.kind;b.onclick=()=>open(k);$('list').append(b)})}
function open(k){
  i=k;const d=DOCS[i];chips();t0=Date.now();
  $('kind').textContent=d.kind;$('title').textContent=d.title;$('body').textContent=d.body;
  $('koBox').hidden=true;$('koBox').textContent=d.ko;$('koBtn').onclick=()=>$('koBox').hidden=!$('koBox').hidden;
  $('speakDoc').onclick=()=>speak(d.title+'. '+d.body);
  $('after').hidden=true;$('timer').textContent='읽기 시작! 다 읽으면 아래 질문에 답하세요.';
  $('qs').innerHTML='';let done=0,right=0;
  d.qs.forEach(([q,opts,a])=>{const box=document.createElement('div');box.className='qbox';box.innerHTML=`<div class="q">${q}</div>`;const o=document.createElement('div');o.className='opts';
    const order=opts.map((x,n)=>n).sort(()=>Math.random()-.5);
    order.forEach(n=>{const b=document.createElement('button');b.className='opt';b.textContent=opts[n];b.onclick=()=>{if(o.dataset.done)return;o.dataset.done=1;
      b.classList.add(n===a?'right':'wrong');if(n!==a)o.children[order.indexOf(a)].classList.add('right');else right++;
      if(++done===d.qs.length){const s=Math.round((Date.now()-t0)/1000);$('timer').textContent=`읽고 답하는 데 ${s}초 · ${right}/${d.qs.length} 정답`;st[i]=1;save();chips();phr()}};o.append(b)});
    box.append(o);$('qs').append(box)});
}
function phr(){const d=DOCS[i];$('after').hidden=false;
  $('phr').innerHTML='';d.phr.forEach(([e,k])=>{const r=document.createElement('div');r.innerHTML=`<span><b>${e}</b></span><span class="muted">${k}</span>`;r.style.cursor='pointer';r.onclick=()=>speak(e);$('phr').append(r)});
  $('nextDoc').onclick=()=>open((i+1)%DOCS.length)}
open(Math.max(0,DOCS.findIndex((d,k)=>!st[k])));
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
